<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tool Room</title>
<style>
:root{
  --primary:#20282D;
  --accent:#F5F51F;
  --orange:#FF6B1A;

  --bg:#F5F5F2;
  --card:#FFFFFF;
  --text:#20282D;
  --sub:#626A6F;
  --border:#D9DDDF;

  --good:#237A3B;
  --good-bg:#E7F4EA;

  --issue:#A66A00;
  --issue-bg:#FFF3D6;

  --bad:#B52A20;
  --bad-bg:#FBE5E2;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#171B1E;
    --card:#22282C;
    --text:#F2F3F3;
    --sub:#B5BBBE;
    --border:#343B40;
    --good-bg:#14351F;
    --issue-bg:#3D2E08;
    --bad-bg:#3A1714;
  }
}

*{box-sizing:border-box;}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Calibri,"Segoe UI",Arial,sans-serif;
  padding-bottom:env(safe-area-inset-bottom,0px);
}

header.brand-header{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  width:100%;
  min-height:120px;
  background:#20282D;
  color:#fff;
  padding:22px 16px 20px;
  padding-top:calc(22px + env(safe-area-inset-top,0px));
  border-bottom:4px solid #FF6B1A;
}
.header-text{flex:1; min-width:0;}
.header-text h1{margin:0; color:#fff; font-size:25px; font-weight:800; letter-spacing:.01em;}
.header-text p{margin:6px 0 0; color:#fff; font-size:13px; line-height:1.4; max-width:430px;}
.header-right{display:flex; flex-direction:column; align-items:flex-end; gap:8px;}
.who{font-size:13px; color:#fff;}
.hbtn{
  background:transparent; border:1px solid #fff; color:#fff; border-radius:8px;
  padding:6px 10px; font-size:13px; font-family:inherit; cursor:pointer;
}
.hbtn + .hbtn{margin-left:6px;}

main{max-width:640px; margin:0 auto; padding:16px 16px 48px;}
.actions{display:flex; gap:10px; margin-bottom:20px;}
button{font-family:inherit; cursor:pointer;}
.btn-big{
  flex:1; padding:18px 10px; font-size:16px; font-weight:bold; border:none;
  border-radius:10px; color:#fff;
}
.btn-out{background:var(--orange); color:#fff;}
.btn-in{background:var(--accent); color:var(--primary);}

h2.section{font-size:15px; letter-spacing:.03em; text-transform:uppercase; color:var(--sub); margin:24px 0 10px;}
.badge{display:inline-block; background:var(--bad); color:#fff; border-radius:20px; padding:1px 8px; font-size:12px; margin-left:6px;}
.card{
  background:var(--card); border:1px solid var(--border); border-radius:10px;
  padding:14px; margin-bottom:10px;
}
.card.attn{border-color:var(--bad); background:var(--bad-bg);}
.card.overdue{border-color:var(--issue);}
.row-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.item-name{font-weight:bold; font-size:16px;}
.code{display:inline-block; font-family:Consolas,monospace; font-size:12px; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:1px 6px; margin-right:6px;}
.meta{color:var(--sub); font-size:13px; margin-top:2px;}
.pill{font-size:11px; font-weight:bold; padding:2px 8px; border-radius:20px; white-space:nowrap;}
.pill-out{background:var(--accent); color:var(--primary);}
.pill-issue{background:var(--issue-bg); color:var(--issue);}
.pill-bad{background:var(--bad-bg); color:var(--bad);}
.note{font-size:14px; margin-top:8px; font-style:italic; color:var(--text);}
.tap-btn{
  margin-top:10px; width:100%; padding:10px; border-radius:8px; border:1px solid var(--border);
  background:transparent; color:var(--orange); font-weight:bold; font-size:14px;
}
.empty{color:var(--sub); font-size:14px; padding:8px 0;}

.overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.5); display:none;
  align-items:flex-end; justify-content:center; z-index:50;
}
.overlay.show{display:flex;}
.sheet{
  background:var(--card); width:100%; max-width:640px; border-radius:16px 16px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px)); max-height:88vh; overflow-y:auto;
}
.sheet h3{margin:0 0 14px;}
label{display:block; font-size:13px; font-weight:bold; color:var(--sub); margin:14px 0 5px;}
input[type=text], input[type=password], textarea{
  width:100%; padding:12px; border:1px solid var(--border); border-radius:8px;
  font-size:16px; background:var(--bg); color:var(--text); font-family:inherit;
}
textarea{min-height:70px; resize:vertical;}
.sheet-actions{display:flex; gap:10px; margin-top:20px;}
.btn-submit{flex:1; padding:14px; border:none; border-radius:8px; background:var(--primary); color:#fff; font-weight:bold; font-size:15px;}
.btn-submit[disabled]{opacity:.45; cursor:not-allowed;}
.btn-cancel{padding:14px 18px; border:1px solid var(--border); border-radius:8px; background:transparent; color:var(--sub); font-weight:bold;}
.pick{
  width:100%; text-align:left; background:var(--card); border:1px solid var(--border);
  border-radius:10px; padding:12px; margin-top:8px; color:var(--text); font-size:15px;
}
.pick .sub{color:var(--sub); font-size:12px; margin-top:2px;}
.chosen{background:var(--good-bg); border:2px solid var(--good); border-radius:10px; padding:12px; margin-top:8px;}
.hint{font-size:12px; color:var(--sub); margin-top:4px;}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(90px,1fr)); gap:8px; margin-bottom:6px;}
.stat{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 6px; text-align:center;}
.stat .n{font-size:26px; font-weight:800;}
.stat .l{font-size:12px; color:var(--sub);}
.stat.s-out .n{color:var(--orange);}
.stat.s-bad .n{color:var(--bad);}
.cond-row{display:flex; gap:8px; margin-top:6px;}
.cond-btn{
  flex:1; padding:12px 4px; border-radius:8px; border:2px solid var(--border);
  background:var(--bg); color:var(--text); font-size:13px; font-weight:bold; text-align:center;
}
.cond-btn.sel-good{border-color:var(--good); background:var(--good-bg); color:var(--good);}
.cond-btn.sel-issue{border-color:var(--issue); background:var(--issue-bg); color:var(--issue);}
.cond-btn.sel-bad{border-color:var(--bad); background:var(--bad-bg); color:var(--bad);}

#toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--primary);
  color:#fff; padding:10px 18px; border-radius:20px; font-size:14px; display:none; z-index:60; max-width:90%; text-align:center;
}
.login{max-width:420px; margin:24px auto 0;}
.login .btn-submit{width:100%; margin-top:18px; background:var(--orange); font-size:18px; padding:16px;}
.err{color:var(--bad); margin-top:12px; font-size:14px; display:none;}
.hidden{display:none !important;}
</style>
</head>
<body>

<header class="brand-header">
  <div class="header-text">
    <h1>Tool Room</h1>
    <p id="tagline"></p>
  </div>
  <div class="header-right">
    <div class="who" id="who"></div>
    <div>
      <button class="hbtn" id="langBtn" onclick="toggleLang()">EN</button>
      <button class="hbtn hidden" id="logoutBtn" onclick="logout()"></button>
    </div>
  </div>
</header>

<main>

  <!-- LOGIN -->
  <div id="loginView" class="card login">
    <label id="lblName"></label>
    <input id="nameInput" type="text" autocomplete="username" autocapitalize="none" autocorrect="off">
    <label id="lblPin"></label>
    <input id="pinInput" type="password" inputmode="numeric" autocomplete="current-password">
    <button class="btn-submit" id="loginBtn" onclick="login()"></button>
    <div class="err" id="loginErr"></div>
  </div>

  <!-- APP -->
  <div id="appView" class="hidden">
    <div class="actions">
      <button class="btn-big btn-out" id="btnOut" onclick="openCheckout()"></button>
      <button class="btn-big btn-in" id="btnIn" onclick="openCheckin()"></button>
    </div>

    <div class="grid" id="stats"></div>

    <h2 class="section"><span id="hAttn"></span> <span id="attnCount" class="badge" style="display:none;"></span></h2>
    <div id="attnList"></div>

    <h2 class="section" id="hOut"></h2>
    <div id="outList"></div>

    <h2 class="section" id="hRecent"></h2>
    <div id="recentList"></div>
  </div>
</main>

<!-- Check Out sheet -->
<div class="overlay" id="overlayOut">
  <div class="sheet">
    <h3 id="outTitle"></h3>
    <div class="hint" id="outAs"></div>

    <label id="lblItem"></label>
    <input type="text" id="outSearch" autocomplete="off" oninput="renderPicks()">
    <div id="picks"></div>
    <div id="chosen" class="chosen hidden"></div>

    <label id="lblNotes"></label>
    <textarea id="outNotes"></textarea>

    <div class="sheet-actions">
      <button class="btn-cancel" id="btnCancel" onclick="closeAll()"></button>
      <button class="btn-submit" id="btnSubmit" onclick="submitCheckout()" disabled></button>
    </div>
  </div>
</div>

<!-- Check In picker sheet -->
<div class="overlay" id="overlayPicker">
  <div class="sheet">
    <h3 id="pickTitle"></h3>
    <div id="pickerList"></div>
    <div class="sheet-actions">
      <button class="btn-cancel" id="btnPickCancel" onclick="closeAll()"></button>
    </div>
  </div>
</div>

<!-- Check In sheet -->
<div class="overlay" id="overlayIn">
  <div class="sheet">
    <h3 id="inTitle"></h3>
    <label id="lblCond"></label>
    <div class="cond-row">
      <button type="button" class="cond-btn" id="condGood" onclick="pickCondition('good')"></button>
      <button type="button" class="cond-btn" id="condIssue" onclick="pickCondition('issue')"></button>
      <button type="button" class="cond-btn" id="condBad" onclick="pickCondition('broken')"></button>
    </div>
    <div id="noteWrap" class="hidden">
      <label id="lblWrong"></label>
      <textarea id="inNote"></textarea>
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn-cancel" id="btnInCancel" onclick="closeAll()"></button>
      <button type="button" class="btn-submit" id="btnInSubmit" onclick="submitCheckin()"></button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://jghsynvbbnemorhyelhd.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_JAmQUU_E_kgxzMWETSceog_DQWDxPE4";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const TZ = 'America/Los_Angeles';

const T = {
  es: {
    tagline:"Anote lo que sale y lo que regresa, con su condición y fecha.",
    name:"Nombre", pin:"PIN", login:"Entrar", logout:"Salir",
    badLogin:"Nombre o PIN incorrecto.",
    noProfile:"Esta cuenta no tiene perfil. Avise al administrador.",
    hello:"Hola", admin:"Admin",
    checkOut:"+ Sacar herramienta", checkIn:"✓ Devolver herramienta",
    attn:"Necesita atención", out:"Afuera ahora", recent:"Devueltas recientemente",
    nothingFlagged:"Nada marcado por ahora.", nothingOut:"Nada afuera por ahora.", noHistory:"Sin historial todavía.",
    outTo:"Con", since:"desde", days:"días",
    returnedBy:"Devuelta por", broken:"Rota", hasIssue:"Con problema", good:"Buena", repair:"En reparación", markFixed:"Marcar arreglada",
    stillOut:"¿Todavía afuera?", yesStillOut:"Sí, todavía la tengo",
    checkOutTitle:"Sacar una herramienta", outAs:"Saliendo a nombre de:", item:"Herramienta (nombre o código)",
    itemHint:"Escriba unas letras o el código, por ejemplo RH-001.",
    notes:"Notas (opcional)", cancel:"Cancelar", confirmOut:"Sacar",
    chosen:"Elegida:", noMatches:"No hay herramientas disponibles con ese nombre.",
    done:"Sacada:", fixedDone:"Marcada como arreglada:", extended:"Listo. Le preguntaremos de nuevo en 14 días.",
    total:"Total", available:"Disponibles", outStat:"Afuera", repairStat:"Reparar", lostRetired:"Perdidas/retiradas",
    checkInTitle:"¿Cuál herramienta regresa?", checkInFor:"Devolver:", condition:"Condición",
    condGood:"✅ Sin daños", condIssue:"⚠️ Funciona, con problema", condBad:"❌ Rota",
    whatsWrong:"¿Qué tiene? (por ejemplo: \"hay que doblar el cable para que funcione\")",
    confirmIn:"Devolver", nothingToReturn:"No hay nada afuera por ahora.",
    pickCondition:"Elija una condición primero.", needNote:"Escriba una nota corta sobre el problema.",
    doneIn:"Devuelta:", errNotOut:"Esa herramienta ya fue devuelta.",
    errNotAvailable:"Esa herramienta ya no está disponible.", errGeneric:"No se pudo guardar. Intente de nuevo.",
    loadErr:"No se pudo cargar. Intente de nuevo."
  },
  en: {
    tagline:"Log what goes out, log what comes back, with condition and date.",
    name:"Name", pin:"PIN", login:"Log in", logout:"Log out",
    badLogin:"Wrong name or PIN.",
    noProfile:"This account has no profile. Tell the admin.",
    hello:"Hi", admin:"Admin",
    checkOut:"+ Check Out Item", checkIn:"✓ Check In Item",
    attn:"Needs Attention", out:"Currently Out", recent:"Recently Checked In",
    nothingFlagged:"Nothing flagged right now.", nothingOut:"Nothing checked out right now.", noHistory:"No history yet.",
    outTo:"Out to", since:"since", days:"days",
    returnedBy:"Returned by", broken:"Broken", hasIssue:"Has Issue", good:"Good", repair:"In repair", markFixed:"Mark Fixed",
    stillOut:"Still out?", yesStillOut:"Yes, I still have it",
    checkOutTitle:"Check Out an Item", outAs:"Checking out as:", item:"Item (name or code)",
    itemHint:"Type a few letters or the code, for example RH-001.",
    notes:"Notes (optional)", cancel:"Cancel", confirmOut:"Check It Out",
    chosen:"Selected:", noMatches:"No available items match that.",
    done:"Checked out:", fixedDone:"Marked fixed:", extended:"Done. We'll ask again in 14 days.",
    total:"Total", available:"Available", outStat:"Out", repairStat:"Repair", lostRetired:"Lost/retired",
    checkInTitle:"Which item is coming back?", checkInFor:"Checking in:", condition:"Condition",
    condGood:"✅ Not Broken", condIssue:"⚠️ Works, Has Issue", condBad:"❌ Broken",
    whatsWrong:"What's wrong? (e.g. \"wire needs to be bent to make it work\")",
    confirmIn:"Check It In", nothingToReturn:"Nothing is checked out right now.",
    pickCondition:"Pick a condition first.", needNote:"Add a quick note on what's wrong.",
    doneIn:"Checked in:", errNotOut:"That item was already checked in.",
    errNotAvailable:"That item is no longer available.", errGeneric:"Couldn't save. Try again.",
    loadErr:"Couldn't load. Try again."
  }
};

let lang = 'es';
try{ lang = localStorage.getItem('lang') || 'es'; }catch(e){}
let profile = null;
let me = null;
let tools = [];
let outs = [];
let recent = [];
let selectedTool = null;
let refreshTimer = null;

function t(k){ return T[lang][k]; }
function $(id){ return document.getElementById(id); }

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// Dates are shown in Los Angeles time no matter where the phone is.
function fmtDate(ts){
  if(!ts) return '';
  return new Date(ts).toLocaleDateString(lang === 'es' ? 'es-US' : 'en-US',
    { month:'short', day:'numeric', timeZone:TZ });
}
function daysSince(ts){
  return Math.floor((Date.now() - new Date(ts).getTime()) / 86400000);
}

function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 2600);
}

function applyLang(){
  document.documentElement.lang = lang;
  $('langBtn').textContent = lang === 'es' ? 'EN' : 'ES';
  $('tagline').textContent = t('tagline');
  $('lblName').textContent = t('name');
  $('lblPin').textContent = t('pin');
  $('loginBtn').textContent = t('login');
  $('logoutBtn').textContent = t('logout');
  $('btnOut').textContent = t('checkOut');
  $('btnIn').textContent = t('checkIn');
  $('hAttn').textContent = t('attn');
  $('hOut').textContent = t('out');
  $('hRecent').textContent = t('recent');
  $('outTitle').textContent = t('checkOutTitle');
  $('lblItem').textContent = t('item');
  $('lblNotes').textContent = t('notes');
  $('btnCancel').textContent = t('cancel');
  $('btnSubmit').textContent = t('confirmOut');
  $('outSearch').placeholder = t('itemHint');
  $('pickTitle').textContent = t('checkInTitle');
  $('btnPickCancel').textContent = t('cancel');
  $('lblCond').textContent = t('condition');
  $('condGood').textContent = t('condGood');
  $('condIssue').textContent = t('condIssue');
  $('condBad').textContent = t('condBad');
  $('lblWrong').textContent = t('whatsWrong');
  $('btnInCancel').textContent = t('cancel');
  $('btnInSubmit').textContent = t('confirmIn');
  if(profile){
    $('who').textContent = t('hello') + ', ' + profile.full_name + (profile.role === 'admin' ? ' (' + t('admin') + ')' : '');
    $('outAs').textContent = t('outAs') + ' ' + profile.full_name;
    render();
  }
}
function toggleLang(){
  lang = lang === 'es' ? 'en' : 'es';
  try{ localStorage.setItem('lang', lang); }catch(e){}
  applyLang();
}

/* ---------- LOGIN ---------- */
// Crew type a first name; the app adds the hidden email domain.
// The admin can type a full email address.
function emailFor(name){
  const n = name.trim().toLowerCase();
  return n.includes('@') ? n : n + '@toolroom.local';
}

async function login(){
  const err = $('loginErr');
  err.style.display = 'none';
  const name = $('nameInput').value;
  const pin = $('pinInput').value;
  if(!name.trim() || !pin){ err.textContent = t('badLogin'); err.style.display = 'block'; return; }

  const { error } = await sb.auth.signInWithPassword({ email: emailFor(name), password: pin });
  if(error){
    console.error(error);
    err.textContent = t('badLogin');
    err.style.display = 'block';
    return;
  }
  await showApp();
}

async function showApp(){
  const err = $('loginErr');
  const { data: { user } } = await sb.auth.getUser();
  if(!user) return;
  me = user;

  const { data, error } = await sb.from('profiles')
    .select('full_name,role,language,active').eq('id', user.id).maybeSingle();
  if(error || !data || !data.active){
    console.error(error);
    await sb.auth.signOut();
    err.textContent = t('noProfile');
    err.style.display = 'block';
    return;
  }
  profile = data;
  $('loginView').classList.add('hidden');
  $('appView').classList.remove('hidden');
  $('logoutBtn').classList.remove('hidden');
  $('pinInput').value = '';
  applyLang();
  await loadAll();
  clearInterval(refreshTimer);
  refreshTimer = setInterval(loadAll, 30000);
}

async function logout(){
  clearInterval(refreshTimer);
  await sb.auth.signOut();
  profile = null; me = null;
  $('appView').classList.add('hidden');
  $('loginView').classList.remove('hidden');
  $('logoutBtn').classList.add('hidden');
  $('who').textContent = '';
  closeAll();
}

/* ---------- LOAD DATA ---------- */
async function loadAll(){
  const [toolsRes, outsRes, recentRes] = await Promise.all([
    sb.from('tools')
      .select('tool_code,name_en,category,location,status,needs_attention,attention_note')
      .order('tool_code'),
    sb.from('checkouts')
      .select('id,tool_code,user_id,out_at,due_check_at,notes_out,tools(name_en),owner:profiles!checkouts_user_id_fkey(full_name)')
      .is('in_at', null)
      .order('out_at', { ascending:true }),
    sb.from('checkouts')
      .select('id,tool_code,out_at,in_at,condition,condition_note,tools(name_en),owner:profiles!checkouts_user_id_fkey(full_name)')
      .not('in_at', 'is', null)
      .order('in_at', { ascending:false })
      .limit(8)
  ]);

  if(toolsRes.error || outsRes.error || recentRes.error){
    console.error(toolsRes.error, outsRes.error, recentRes.error);
    toast(t('loadErr'));
    return;
  }
  tools = toolsRes.data || [];
  outs = outsRes.data || [];
  recent = recentRes.data || [];
  render();
}

/* ---------- RENDER ---------- */
function codeTag(code){ return '<span class="code">' + escapeHtml(code) + '</span>'; }

function render(){
  // Inventory counts
  const n = s => tools.filter(x => x.status === s).length;
  const lostRet = n('lost') + n('retired');
  let statsHtml =
    '<div class="stat"><div class="n">' + tools.length + '</div><div class="l">' + t('total') + '</div></div>' +
    '<div class="stat"><div class="n">' + n('available') + '</div><div class="l">' + t('available') + '</div></div>' +
    '<div class="stat s-out"><div class="n">' + n('out') + '</div><div class="l">' + t('outStat') + '</div></div>' +
    '<div class="stat s-bad"><div class="n">' + n('needs_repair') + '</div><div class="l">' + t('repairStat') + '</div></div>';
  if(lostRet > 0){
    statsHtml += '<div class="stat"><div class="n">' + lostRet + '</div><div class="l">' + t('lostRetired') + '</div></div>';
  }
  $('stats').innerHTML = statsHtml;

  // Needs attention
  const attn = tools.filter(x => x.needs_attention || x.status === 'needs_repair');
  const attnEl = $('attnList');
  const cnt = $('attnCount');
  if(attn.length){
    cnt.style.display = 'inline-block';
    cnt.textContent = attn.length;
    attnEl.innerHTML = '';
    attn.forEach(x => {
      const isBroken = x.status === 'needs_repair';
      const div = document.createElement('div');
      div.className = 'card attn';
      div.innerHTML =
        '<div class="row-top"><div>' +
          '<div class="item-name">' + codeTag(x.tool_code) + escapeHtml(x.name_en) + '</div>' +
          '<div class="meta">' + escapeHtml(x.location || '') + '</div>' +
        '</div><span class="pill ' + (isBroken ? 'pill-bad' : 'pill-issue') + '">' +
          (isBroken ? t('broken') : t('hasIssue')) + '</span></div>' +
        (x.attention_note ? '<div class="note">' + escapeHtml(x.attention_note) + '</div>' : '');
      if(profile && profile.role === 'admin'){
        const b = document.createElement('button');
        b.className = 'tap-btn';
        b.textContent = t('markFixed');
        b.onclick = () => markFixed(x);
        div.appendChild(b);
      }
      attnEl.appendChild(div);
    });
  } else {
    cnt.style.display = 'none';
    attnEl.innerHTML = '<div class="empty">' + t('nothingFlagged') + '</div>';
  }

  // Currently out
  const outEl = $('outList');
  if(outs.length){
    outEl.innerHTML = '';
    outs.forEach(c => {
      const days = daysSince(c.out_at);
      const askStill = new Date(c.due_check_at).getTime() < Date.now();
      const div = document.createElement('div');
      div.className = 'card' + (askStill ? ' overdue' : '');
      const who = c.owner ? c.owner.full_name : '';
      div.innerHTML =
        '<div class="row-top"><div>' +
          '<div class="item-name">' + codeTag(c.tool_code) + escapeHtml(c.tools ? c.tools.name_en : '') + '</div>' +
          '<div class="meta">' + t('outTo') + ' ' + escapeHtml(who) + ' — ' + t('since') + ' ' + fmtDate(c.out_at) +
            (days >= 1 ? ' — ' + days + ' ' + t('days') : '') + '</div>' +
        '</div><span class="pill pill-out">OUT</span></div>' +
        (c.notes_out ? '<div class="note">' + escapeHtml(c.notes_out) + '</div>' : '');
      if(askStill && me && c.user_id === me.id){
        const q = document.createElement('div');
        q.className = 'note';
        q.textContent = t('stillOut');
        div.appendChild(q);
        const b = document.createElement('button');
        b.className = 'tap-btn';
        b.textContent = t('yesStillOut');
        b.onclick = () => extendCheckout(c.id);
        div.appendChild(b);
      }
      outEl.appendChild(div);
    });
  } else {
    outEl.innerHTML = '<div class="empty">' + t('nothingOut') + '</div>';
  }

  // Recently checked in
  const recEl = $('recentList');
  if(recent.length){
    recEl.innerHTML = '';
    recent.forEach(c => {
      const pillClass = c.condition === 'good' ? 'pill-out' : (c.condition === 'broken' ? 'pill-bad' : 'pill-issue');
      const pillText = c.condition === 'good' ? t('good') : (c.condition === 'broken' ? t('broken') : t('hasIssue'));
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML =
        '<div class="row-top"><div>' +
          '<div class="item-name">' + codeTag(c.tool_code) + escapeHtml(c.tools ? c.tools.name_en : '') + '</div>' +
          '<div class="meta">' + escapeHtml(c.owner ? c.owner.full_name : '') + ' — ' +
            fmtDate(c.out_at) + ' → ' + fmtDate(c.in_at) + '</div>' +
        '</div><span class="pill ' + pillClass + '">' + pillText + '</span></div>' +
        (c.condition_note ? '<div class="note">' + escapeHtml(c.condition_note) + '</div>' : '');
      recEl.appendChild(div);
    });
  } else {
    recEl.innerHTML = '<div class="empty">' + t('noHistory') + '</div>';
  }
}

/* ---------- CHECK OUT ---------- */
function openCheckout(){
  selectedTool = null;
  $('outSearch').value = '';
  $('outNotes').value = '';
  $('chosen').classList.add('hidden');
  $('outSearch').classList.remove('hidden');
  $('btnSubmit').disabled = true;
  renderPicks();
  $('overlayOut').classList.add('show');
}

function closeAll(){
  $('overlayOut').classList.remove('show');
  $('overlayPicker').classList.remove('show');
  $('overlayIn').classList.remove('show');
}

function renderPicks(){
  const el = $('picks');
  const q = $('outSearch').value.trim().toLowerCase();
  if(!q){ el.innerHTML = ''; return; }

  const matches = tools
    .filter(x => x.status === 'available' &&
      (x.name_en.toLowerCase().includes(q) || x.tool_code.toLowerCase().includes(q)))
    .slice(0, 8);

  if(!matches.length){
    el.innerHTML = '<div class="empty">' + t('noMatches') + '</div>';
    return;
  }
  el.innerHTML = '';
  matches.forEach(x => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pick';
    b.innerHTML = codeTag(x.tool_code) + escapeHtml(x.name_en) +
      '<div class="sub">' + escapeHtml([x.category, x.location].filter(Boolean).join(' — ')) + '</div>';
    b.onclick = () => chooseTool(x);
    el.appendChild(b);
  });
}

function chooseTool(x){
  selectedTool = x;
  $('picks').innerHTML = '';
  $('outSearch').classList.add('hidden');
  const c = $('chosen');
  c.innerHTML = t('chosen') + ' ' + codeTag(x.tool_code) + '<strong>' + escapeHtml(x.name_en) + '</strong>' +
    '<div class="sub" style="font-size:12px;color:var(--sub);margin-top:2px;">' +
    escapeHtml([x.category, x.location].filter(Boolean).join(' — ')) + '</div>';
  c.classList.remove('hidden');
  c.onclick = () => {
    selectedTool = null;
    c.classList.add('hidden');
    $('outSearch').classList.remove('hidden');
    $('outSearch').value = '';
    $('btnSubmit').disabled = true;
    $('outSearch').focus();
  };
  $('btnSubmit').disabled = false;
}

async function submitCheckout(){
  if(!selectedTool) return;
  const btn = $('btnSubmit');
  btn.disabled = true;

  const { error } = await sb.rpc('check_out_tool', {
    p_tool_code: selectedTool.tool_code,
    p_notes: $('outNotes').value.trim()
  });

  if(error){
    console.error(error);
    toast((error.message || '').includes('tool_not_available') ? t('errNotAvailable') : t('errGeneric'));
    await loadAll();
    btn.disabled = false;
    return;
  }
  const name = selectedTool.tool_code + ' ' + selectedTool.name_en;
  closeAll();
  toast(t('done') + ' ' + name);
  await loadAll();
}

/* ---------- CHECK IN ---------- */
let activeCheckin = null;
let selectedCondition = null;

function openCheckin(){
  if(!outs.length){ toast(t('nothingToReturn')); return; }
  const list = $('pickerList');
  list.innerHTML = '';
  outs.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pick';
    b.innerHTML = codeTag(c.tool_code) + escapeHtml(c.tools ? c.tools.name_en : '') +
      '<div class="sub">' + t('outTo') + ' ' + escapeHtml(c.owner ? c.owner.full_name : '') +
      ' — ' + t('since') + ' ' + fmtDate(c.out_at) + '</div>';
    b.onclick = () => startCheckin(c);
    list.appendChild(b);
  });
  $('overlayPicker').classList.add('show');
}

function startCheckin(c){
  activeCheckin = c;
  selectedCondition = null;
  $('overlayPicker').classList.remove('show');
  $('inTitle').textContent = t('checkInFor') + ' ' + c.tool_code + ' ' + (c.tools ? c.tools.name_en : '');
  $('inNote').value = '';
  $('noteWrap').classList.add('hidden');
  ['condGood','condIssue','condBad'].forEach(id =>
    $(id).classList.remove('sel-good','sel-issue','sel-bad'));
  $('btnInSubmit').disabled = false;
  $('overlayIn').classList.add('show');
}

function pickCondition(cond){
  selectedCondition = cond;
  ['condGood','condIssue','condBad'].forEach(id =>
    $(id).classList.remove('sel-good','sel-issue','sel-bad'));
  if(cond === 'good') $('condGood').classList.add('sel-good');
  if(cond === 'issue') $('condIssue').classList.add('sel-issue');
  if(cond === 'broken') $('condBad').classList.add('sel-bad');
  $('noteWrap').classList.toggle('hidden', cond === 'good');
}

async function submitCheckin(){
  if(!activeCheckin) return;
  if(!selectedCondition){ toast(t('pickCondition')); return; }
  const note = $('inNote').value.trim();
  if(selectedCondition !== 'good' && !note){ toast(t('needNote')); return; }

  const btn = $('btnInSubmit');
  btn.disabled = true;

  const { error } = await sb.rpc('check_in_tool', {
    p_tool_code: activeCheckin.tool_code,
    p_condition: selectedCondition,
    p_note: note
  });

  if(error){
    console.error(error);
    toast((error.message || '').includes('not_checked_out') ? t('errNotOut') : t('errGeneric'));
    await loadAll();
    btn.disabled = false;
    return;
  }
  const name = activeCheckin.tool_code + ' ' + (activeCheckin.tools ? activeCheckin.tools.name_en : '');
  activeCheckin = null;
  closeAll();
  toast(t('doneIn') + ' ' + name);
  await loadAll();
}

/* ---------- OTHER ACTIONS ---------- */

async function extendCheckout(id){
  const { error } = await sb.rpc('extend_checkout', { p_checkout_id: id });
  if(error){ console.error(error); toast(t('errGeneric')); return; }
  toast(t('extended'));
  await loadAll();
}

async function markFixed(x){
  const { error } = await sb.from('tools').update({
    status: x.status === 'needs_repair' ? 'available' : x.status,
    needs_attention: false,
    attention_note: '',
    updated_at: new Date().toISOString()
  }).eq('tool_code', x.tool_code);
  if(error){ console.error(error); toast(t('errGeneric')); return; }
  toast(t('fixedDone') + ' ' + x.tool_code);
  await loadAll();
}

/* ---------- START ---------- */
(async function init(){
  applyLang();
  const { data: { session } } = await sb.auth.getSession();
  if(session) await showApp();
})();
</script>
